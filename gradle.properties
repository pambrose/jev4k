# Gradle settings
group=com.pambrose.jev4k
version=0.2.0
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

# Hosts that cannot build every native target (Apple targets on Linux or Windows) skip them quietly.
kotlin.native.ignoreDisabledTargets=true
