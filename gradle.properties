# Gradle settings
group=com.pambrose.jev4k
version=0.3.0
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

# A host that can't fully build a native target skips what it can't do quietly: Linux compiles the Apple klibs but
# can't link or run Apple binaries.
kotlin.native.ignoreDisabledTargets=true
