name: Documentation
on:
    # Pull requests and pushes to master only build the site, so a broken snippet, link or Dokka setting fails a
    # check before it merges.
    pull_request:
    push:
        branches:
            - master
    # The site is deployed only when a release is published, after its artifacts are on Maven Central, or on a
    # manual run, so jev4k.com never shows install instructions for a version Central doesn't have yet. A release
    # runs on its tag, so the github-pages environment allows release tags as well as master.
    release:
        types: [ published ]
    workflow_dispatch:

# Least privilege by default; each job asks for what it needs.
permissions:
    contents: read

# Deploys share one group and are never cancelled. Build-only runs get a group per ref, so a newer push to a PR
# supersedes its older run, and no build-only run can replace a deploy waiting in the queue.
concurrency:
    group: >-
        ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        && 'pages' || format('docs-{0}', github.ref) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Build the docs site + KDocs, and upload the Pages artifact when deploying. Kept separate from the deploy job
    # so that recovering a failed deploy means re-running only the deploy job (via "Re-run failed jobs"), which does
    # NOT re-upload the artifact. actions/deploy-pages hard-fails when a run contains more than one artifact named
    # "github-pages", which is what re-running a combined build+deploy job did. Its check, "docs", is required by
    # branch protection.
    #
    # It restores nothing from a cache. This workflow publishes the site, and a cache entry written by another run
    # (even of a trusted workflow, through a compromised action or dependency) could change what gets deployed:
    # zizmor's cache-poisoning audit. zizmor accepts caching only when it is off for every run of a publishing
    # workflow, not just the deploying ones, so the build-only runs go without too. They are still shorter than CI.
    docs:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        env:
            DEPLOY: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        steps:
            -   uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
                if: env.DEPLOY == 'true'
            # Nothing here pushes, so checkout doesn't leave the token in .git/config, where a later step could
            # read it (zizmor's artipacked audit).
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            # Build the Zensical documentation site from website/uv.lock, the same resolution `make site`
            # uses locally. uv reads website/.python-version and installs that Python itself. --strict turns
            # warnings, such as a link to a missing anchor, into failures.
            -   uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
                with:
                    # Its "auto" default skips the cache on a release but not on a manual run, which deploys too.
                    enable-cache: false
            -   run: uv run --locked zensical build --clean --strict
                working-directory: website/jev4k

            # Build KDoc API documentation (the toolchain in the catalog is JDK 25).
            -   uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    distribution: temurin
                    java-version: 25
            -   uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
                with:
                    cache-disabled: true
            # Dokka documents every source set, the native ones included, so it downloads the Kotlin/Native
            # toolchain; ci.yml's ~/.konan cache isn't restored here, for the reason above.
            -   run: ./gradlew dokkaGeneratePublicationHtml

            # Copy KDocs into the Zensical site output; the site's "KDocs" page links to /kdocs/.
            -   run: cp -r build/dokka/html website/jev4k/site/kdocs

            -   uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
                if: env.DEPLOY == 'true'
                with:
                    path: website/jev4k/site

    # Deploy the artifact produced by the docs job, for a published release or a manual run only. Deliberately
    # minimal (no checkout or build) so re-running just this job re-deploys the existing artifact without
    # rebuilding or re-uploading it.
    deploy:
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        needs: docs
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
            actions: read
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
                id: deployment
