name: CI

on:
    push:
        branches: [ master ]
    # A push to a PR branch fires only this event, so nothing runs twice.
    pull_request:
    workflow_dispatch:

# Supersede a PR's earlier run when it is pushed to again. On master nothing is cancelled, but GitHub keeps only one
# pending run per group, so a burst of pushes can skip a queued middle commit; the latest one is always built.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    # Linux runs the jvm, js, wasmJs and linuxX64 tests, and linuxArm64's under QEMU. It can't run the Apple or
    # Windows test executables, so the native job below covers those.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # JDK 25 is the toolchain in the catalog.
            -   uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    distribution: temurin
                    java-version: 25
            -   uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            # setup-gradle caches ~/.gradle but not the Kotlin/Native toolchain that compiling the native targets
            # downloads. The toolchain depends only on the Kotlin version, so that is the whole key: an exact hit, or
            # a fresh download saved under the new version. No restore-keys, which would carry every older toolchain
            # forward into each new entry.
            -   id: kotlin
                shell: bash
                run: |
                    version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)
                    test -n "$version"
                    echo "version=$version" >> "$GITHUB_OUTPUT"
            -   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.konan
                    key: konan-${{ runner.os }}-${{ steps.kotlin.outputs.version }}

            # build runs check, which compiles every target this host supports and runs lintKotlin, detekt, the ABI
            # check against api/, and the jvm, js, wasmJs and linuxX64 tests. --continue lets independent tasks run
            # after a failure, but Kover's reports depend on jvmTest, so a JVM test failure leaves no coverage to
            # upload. The live tests stay disabled: they need JEV4K_LIVE=1 (and LiveSmokeTest a TYPESAFE_API_KEY),
            # and neither is set here.
            -   name: Build, lint, check the ABI, run the tests, and generate the coverage report
                run: ./gradlew --continue build koverVerify koverXmlReport koverLog

            # linuxArm64 is published but has no Gradle test task, and this runner can't execute its binary. QEMU lets
            # Docker run it, so the same make target that tests it locally tests it here; linuxX64's tests already ran
            # in the step above.
            -   uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
                with:
                    platforms: arm64
            -   name: Run the linuxArm64 tests in Docker
                run: make docker-linux-tests LINUX_TEST_TARGETS=linuxArm64:arm64

            -   name: Upload test reports on failure
                if: failure()
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: test-reports
                    path: |
                        build/reports/tests/
                        build/test-results/
                    retention-days: 7

            -   name: Upload coverage to Codecov
                if: always()
                uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: build/reports/kover/report.xml
                    flags: unittests
                    name: jev4k
                    fail_ci_if_error: false

    # The library ships Java 17 bytecode, so the suite has to run on 17, not just compile against its API.
    # -Xjdk-release stops a newer JDK method from linking in; it says nothing about how the classes behave on an
    # older runtime. 25 is included so the matrix covers every JDK this project claims, even though the build
    # job already tests there.
    test:
        name: Tests on JDK ${{ matrix.java }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            # One JDK failing shouldn't hide the result on the others.
            fail-fast: false
            matrix:
                java: [ 17, 21, 25 ]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Two JDKs: the matrix one runs the tests, and 25 is the toolchain that compiles them. The last
            # entry becomes JAVA_HOME, so Gradle itself always runs on 25. On the 25 row both entries are 25,
            # which installs once.
            -   uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    distribution: temurin
                    java-version: |
                        ${{ matrix.java }}
                        25
            -   uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

            # Gradle doesn't scan the runner's tool cache, so point it at what setup-java installed. The names
            # are setup-java's JAVA_HOME_<major>_<arch> variables, hence X64 for ubuntu-latest. If a lookup ever
            # misses, the foojay resolver in settings.gradle.kts downloads the JDK instead, so this is a
            # shortcut rather than a requirement.
            -   name: Run tests on JDK ${{ matrix.java }}
                run: >
                    ./gradlew jvmTest -PtestJavaVersion=${{ matrix.java }}
                    "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64,JAVA_HOME_25_X64"

            -   name: Upload test reports on failure
                if: failure()
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: test-reports-jdk-${{ matrix.java }}
                    path: |
                        build/reports/tests/
                        build/test-results/
                    retention-days: 7

    # The native tests Linux can't run: the macOS and the iOS, tvOS and watchOS simulator tests on macOS (Gradle skips
    # iosX64Test on the arm64 runner, and a tvOS or watchOS test when the runner has no simulator device for it), and
    # the mingwX64 tests on Windows.
    native:
        name: Native tests on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            # One OS failing shouldn't hide the result on the other.
            fail-fast: false
            matrix:
                include:
                    -   name: apple
                        os: macos-latest
                        tasks: macosArm64Test iosSimulatorArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test
                    -   name: windows
                        os: windows-latest
                        tasks: mingwX64Test
        defaults:
            run:
                shell: bash
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    distribution: temurin
                    java-version: 25
            -   uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            # setup-gradle caches ~/.gradle but not the Kotlin/Native toolchain that compiling the native targets
            # downloads. The toolchain depends only on the Kotlin version, so that is the whole key: an exact hit, or
            # a fresh download saved under the new version. No restore-keys, which would carry every older toolchain
            # forward into each new entry.
            -   id: kotlin
                shell: bash
                run: |
                    version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)
                    test -n "$version"
                    echo "version=$version" >> "$GITHUB_OUTPUT"
            -   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.konan
                    key: konan-${{ runner.os }}-${{ steps.kotlin.outputs.version }}

            -   name: Run the native tests
                run: ./gradlew ${{ matrix.tasks }}

            -   name: Upload test reports on failure
                if: failure()
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: test-reports-${{ matrix.name }}
                    path: |
                        build/reports/tests/
                        build/test-results/
                    retention-days: 7

    # The one CI check branch protection requires (with the docs site's "docs" check and GitGuardian). It passes only
    # when every job above succeeded, so the JDK matrix and both native jobs gate a merge too, and renaming a job or a
    # matrix entry can't silently drop a required check.
    ci-ok:
        if: always()
        needs: [ build, test, native ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   name: Fail unless every CI job succeeded
                env:
                    RESULTS: ${{ join(needs.*.result, ' ') }}
                run: |
                    echo "Job results: $RESULTS"
                    for result in $RESULTS; do [ "$result" = success ] || exit 1; done
