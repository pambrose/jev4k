# Codecov configuration: https://docs.codecov.com/docs/codecov-yaml
# CI (.github/workflows/ci.yml) uploads the Kover XML report, build/reports/kover/report.xml. Codecov reports; it
# doesn't gate. Branch protection doesn't require its statuses, and the upload can't fail CI, so the coverage gate is
# Kover's line and branch floors in build.gradle.kts (`make coverage-verify`, and koverVerify in CI's build job).
codecov:
    require_ci_to_pass: true
    notify:
        wait_for_ci: true

coverage:
    precision: 2
    status:
        # Flag a drop of more than 1% in total coverage below the base commit, without failing the status.
        project:
            default:
                target: auto
                threshold: 1%
                informational: true
        # Report, but don't gate on, coverage of the lines a change touches.
        patch:
            default:
                target: 80%
                threshold: 5%
                informational: true

comment:
    layout: "diff, flags, files, footer"
    behavior: default
    require_changes: true

# Kover measures the JVM target, which runs the common code as well as the JVM-only code.
flags:
    unittests:
        paths:
            - src/commonMain/
            - src/jvmMain/
        carryforward: true
